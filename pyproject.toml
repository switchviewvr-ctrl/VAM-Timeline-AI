[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vam-timeline-ai"
version = "0.1.0"
description = "Semantic VaM Timeline motion analysis tools, starting with cowgirl/riding motion."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "VaM Timeline AI" }
]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6"
]

[project.optional-dependencies]
dev = [
  "pytest>=7"
]
ml = [
  "scikit-learn>=1.3"
]
viz = [
  "matplotlib>=3.7"
]

[project.scripts]
vam-timeline-ai = "vam_timeline_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
